name: Brahmastra_Ultimate_Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 🔱 Manual Button Trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libssl-dev libjpeg-dev zlib1g-dev libffi8 liblzma-dev uuid-dev openjdk-17-jdk

      - name: Setup Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.36 virtualenv
          export PATH=$PATH:$HOME/.local/bin

      - name: Build APK (The Force Method)
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 3 baar koshish karega agar internet fail ho
          for i in {1..3}; do
            yes | buildozer android debug && break || sleep 30
          done
          
          # 🔱 APK Hunt
          find . -name "*.apk" -exec cp {} ./brahmastra_final.apk \;
        continue-on-error: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brahmastra-Official-APK
          path: brahmastra_final.apk

